name: Instalar reescritura auditada v1
on:
  push:
    branches: [rewrite/v1]
    paths:
      - '.staging/DashersBot-v1.tar.xz'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  preparar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rewrite/v1
      - name: Verificar la integridad del archivo
        run: |
          echo 'b8a6f64d2a864a8d1bfe2102b8ab8e6380d095c3aad4117c232ce6fe93587191  .staging/DashersBot-v1.tar.xz' | sha256sum --check
          tar -tJf .staging/DashersBot-v1.tar.xz
      - name: Sustituir código anterior (con respaldo en backup/v0.2)
        run: |
          rm -rf src test tools data
          rm -f .github/workflows/import.yml
          tar -xJf .staging/DashersBot-v1.tar.xz
          rm -rf .staging
          rm -f .github/workflows/unpack.yml
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependencias
        run: npm install --no-audit --ignore-scripts
      - name: Validar sintaxis, funciones e integración de comandos
        run: |
          npm run verify
          node --input-type=module -e "const m=await import('./src/bot/commands.js'); const x=m.commandDefinitions.map(c=>c.toJSON()); if(x.length!==14)throw new Error('No se registraron los comandos previstos'); console.log('COMANDOS OK:',x.length)"
      - name: Publicar únicamente los archivos verificados
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'Reescritura Dashers Bot v1.0: módulos separados y auditados'
            git push origin HEAD:rewrite/v1
          fi
