name: Importar Dashers Bot desde ZIP
on:
  push:
    paths:
      - 'DashersBot-v0.2-Waifly-LISTO.zip'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  importar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Comprobar integridad del ZIP
        shell: bash
        run: |
          test -f DashersBot-v0.2-Waifly-LISTO.zip
          echo "6d304814f3c2996e9ab67d45b62cf7a705c1b8beeed6f25da8f75ba1ffdb5658  DashersBot-v0.2-Waifly-LISTO.zip" | sha256sum -c -
          unzip -t DashersBot-v0.2-Waifly-LISTO.zip
      - name: Extraer código a la raíz del repositorio
        shell: bash
        run: |
          unzip -q -o DashersBot-v0.2-Waifly-LISTO.zip
          rm DashersBot-v0.2-Waifly-LISTO.zip
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Comprobar sintaxis y ejecutar pruebas
        run: |
          npm run check
          npm test
      - name: Publicar archivos individuales
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No hay cambios pendientes'
          else
            git commit -m 'Importar archivos de Dashers Bot v0.2 (probados)'
            git push
          fi
